services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev
      POSTGRES_DB: nexus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # API — FastAPI console + platform APIs.
  backend:
    build:
      context: ../nexus-backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://nexus:nexus_dev@postgres:5432/nexus
      SECRET_KEY: dev-secret-change-in-production-nexus-2026
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Console — Vite dev server. Its /api proxy forwards to the backend
  # service (VITE_BACKEND_URL), so the browser only ever talks to
  # this origin — no separate -8000 port to forward in Codespaces.
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

  # Scheduler worker — runs patch deployments, threat hunts, remediation
  # workflows, and expiry housekeeping. Run exactly one replica: two
  # workers would both advance the same records (harmless by design,
  # but it would double the AuditEvents). See docs/scheduler.md.
  worker:
    build:
      context: ../nexus-backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://nexus:nexus_dev@postgres:5432/nexus
      SCHEDULER_INTERVAL_SECONDS: "60"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped

volumes:
  postgres_data:
